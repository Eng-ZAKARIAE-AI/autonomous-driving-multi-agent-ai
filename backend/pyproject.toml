[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-backend"
version = "0.1.0"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "pyyaml",
    "opencv-python",
    "torch",
    "torchvision",
    "gymnasium",
    "ray[rllib]",
    "carla==0.9.15",
    "fastapi",
    "uvicorn",
    "websockets"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
